name: Publish public CV PDFs

on:
  push:
    branches: [main]
    paths:
      - "career/cvs/**"
      - "scripts/sync-public-cvs.mjs"
      - ".github/workflows/publish-cvs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile canonical CVs with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: career/cvs/*.tex
          working_directory: .
          latexmk_use_xelatex: true
        env:
          TEXINPUTS: ".:"

      - name: Copy generated PDFs to public assets
        run: node scripts/sync-public-cvs.mjs

      - name: Commit public PDF updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv
          git diff --cached --quiet || git commit -m "chore(cv): publish generated PDFs"
          git push
