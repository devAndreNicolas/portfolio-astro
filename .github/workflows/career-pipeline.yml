name: Refresh career pipeline
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm jobs:collect:br
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      - run: pnpm applications:analyze && pnpm roles:recommend && pnpm career:dashboard
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career/applications career/roles src/data/career-dashboard.json
          git diff --cached --quiet || git commit -m "chore(career): refresh job pipeline"
          git push
